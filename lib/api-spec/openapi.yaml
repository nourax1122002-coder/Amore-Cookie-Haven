openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Amore Cookies storefront and management API
servers:
  - url: /api
paths:
  /assistant/status:
    get:
      operationId: getAssistantStatus
      responses:
        "200":
          description: Public assistant configuration without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
  /assistant/chat:
    post:
      operationId: sendAssistantMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantInput" }
      responses:
        "200":
          description: Genuine Arabic model response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantReply" }
        "400":
          description: Invalid or private input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantFailure" }
        "429":
          description: Shared free allowance or per-client limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantFailure" }
        "503":
          description: No safe free route, configuration or temporary service failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantFailure" }
        "504":
          description: Bounded assistant request timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantFailure" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /store:
    get:
      operationId: getStore
      responses:
        "200":
          description: Public content and launch readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
  /products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: Shopify products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{handle}:
    get:
      operationId: getProduct
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /cart:
    get:
      operationId: getCart
      responses:
        "200":
          description: Current Shopify cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    post:
      operationId: updateCart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartInput" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /checkout:
    post:
      operationId: startCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Real Shopify checkout URL, only when enabled and KWD configured
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
  /payments/availability:
    get:
      operationId: getPaymentAvailability
      responses:
        "200":
          description: Live payment readiness and approved delivery charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAvailability" }
  /payments/order:
    get:
      operationId: getPaymentOrder
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Receipt protected by an unguessable order token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatus" }
  /admin/local-orders:
    get:
      operationId: listLocalOrders
      responses:
        "200":
          description: Locally managed orders, administrator only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocalOrder" }
  /admin/local-orders/{id}:
    patch:
      operationId: updateLocalOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderFulfillmentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
  /admin/local-orders/{id}/reconcile:
    post:
      operationId: reconcileLocalOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Payment rechecked with provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }
  /wholesale:
    post:
      operationId: createInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryInput" }
      responses:
        "201":
          description: Saved inquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
  /tracking:
    post:
      operationId: trackOrder
      description: Exact order number and checkout phone verification. Returns minimal Shopify data only; no customer addresses or privileged status links.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingInput" }
      responses:
        "200":
          description: Verified Shopify status or identical response for every unsuccessful match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingResult" }
        "429":
          description: Too many attempts; retry after the Retry-After header
        "503":
          description: Shopify tracking temporarily unavailable
  /admin/orders:
    get:
      operationId: listAdminOrders
      description: Administrator-only live Shopify orders, newest first. Updates and cancellations are handled in Shopify.
      parameters:
        - in: query
          name: after
          schema: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: A live page of Shopify orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401":
          description: Sign in required
        "403":
          description: Approved administrator required
  /admin/me:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Server verified authorization
          content:
            application/json:
              schema:
                type: object
                required: [isAdmin, setupRequired]
                properties:
                  isAdmin: { type: boolean }
                  setupRequired: { type: boolean }
  /admin/summary:
    get:
      operationId: getAdminSummary
      responses:
        "200":
          description: Actual inquiries and inventory; Shopify management destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Editable settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
    put:
      operationId: saveSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
  /admin/inquiries:
    get:
      operationId: listInquiries
      responses:
        "200":
          description: Café inquiries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inquiry" }
  /admin/inquiries/{id}:
    patch:
      operationId: updateInquiry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
  /admin/products:
    get:
      operationId: listAdminProducts
      responses:
        "200":
          description: Product inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: saveProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Saved Shopify product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
components:
  schemas:
    AssistantStatus:
      type: object
      required: [enabled, dailyLimit, perMinuteLimit]
      properties:
        enabled: { type: boolean }
        dailyLimit: { type: integer }
        perMinuteLimit: { type: integer }
    AssistantMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 1200 }
    AssistantInput:
      type: object
      required: [messages]
      properties:
        language: { type: string, enum: [ar, en], default: ar }
        messages:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/AssistantMessage" }
    AssistantReply:
      type: object
      required: [reply, model, zeroCostVerified]
      properties:
        reply: { type: string }
        model: { type: string }
        zeroCostVerified: { type: boolean }
    AssistantFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        retryAfterSeconds: { type: integer, minimum: 1 }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Product:
      type: object
      required: [id, handle, title, titleAr, description, descriptionAr, price, currency, shopCurrency, pieces, imageUrl, variantId, available, stock, lowStockThreshold, ingredients, ingredientsAr]
      properties:
        id: { type: string }
        handle: { type: string }
        title: { type: string }
        titleAr: { type: string }
        description: { type: string }
        descriptionAr: { type: string }
        price: { type: number }
        currency: { type: string }
        shopCurrency: { type: string }
        pieces: { type: integer }
        imageUrl: { type: string }
        variantId: { type: string }
        available: { type: boolean }
        stock: { type: integer }
        lowStockThreshold: { type: integer }
        ingredients: { type: string }
        ingredientsAr: { type: string }
    ProductInput:
      type: object
      required: [title, titleAr, description, descriptionAr, price, pieces, imageUrl, stock, lowStockThreshold, ingredients, ingredientsAr]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 150 }
        titleAr: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        descriptionAr: { type: string, maxLength: 5000 }
        price: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        pieces: { type: integer, minimum: 1, maximum: 1000 }
        imageUrl: { type: string, maxLength: 2000 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 1000000 }
        ingredients: { type: string, maxLength: 5000 }
        ingredientsAr: { type: string, maxLength: 5000 }
    BakingStep:
      type: object
      required: [titleEn, titleAr, textEn, textAr]
      properties:
        titleEn: { type: string, maxLength: 150 }
        titleAr: { type: string, maxLength: 150 }
        textEn: { type: string, maxLength: 1000 }
        textAr: { type: string, maxLength: 1000 }
    StoreSettings:
      type: object
      required: [heroTitleEn, heroTitleAr, heroTextEn, heroTextAr, aboutEn, aboutAr, storageEn, storageAr, policiesEn, policiesAr, whatsapp, email, phone, hoursEn, hoursAr, bakingSteps, checkoutEnabled, logoImage, bakerImage, packageImage, cookieImage]
      properties:
        heroTitleEn: { type: string, maxLength: 250 }
        heroTitleAr: { type: string, maxLength: 250 }
        heroTextEn: { type: string, maxLength: 1000 }
        heroTextAr: { type: string, maxLength: 1000 }
        aboutEn: { type: string, maxLength: 5000 }
        aboutAr: { type: string, maxLength: 5000 }
        storageEn: { type: string, maxLength: 2000 }
        storageAr: { type: string, maxLength: 2000 }
        policiesEn: { type: string, maxLength: 5000 }
        policiesAr: { type: string, maxLength: 5000 }
        whatsapp: { type: string, maxLength: 30 }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        hoursEn: { type: string, maxLength: 500 }
        hoursAr: { type: string, maxLength: 500 }
        bakingSteps:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/BakingStep" }
        checkoutEnabled: { type: boolean }
        logoImage: { type: string, maxLength: 2000 }
        bakerImage: { type: string, maxLength: 2000 }
        packageImage: { type: string, maxLength: 2000 }
        cookieImage: { type: string, maxLength: 2000 }
    Store:
      type: object
      required: [settings, checkoutReady, launchMessage, shopCurrency]
      properties:
        settings: { $ref: "#/components/schemas/StoreSettings" }
        checkoutReady: { type: boolean }
        launchMessage: { type: string }
        shopCurrency: { type: string }
    CartLine:
      type: object
      required: [id, variantId, handle, title, quantity, price, imageUrl]
      properties:
        id: { type: string }
        variantId: { type: string }
        handle: { type: string }
        title: { type: string }
        quantity: { type: integer }
        price: { type: number }
        imageUrl: { type: string }
    Cart:
      type: object
      required: [lines, subtotal, discount, total, currency, checkoutReady, message, discountCodes]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        subtotal: { type: number }
        discount: { type: number }
        total: { type: number }
        currency: { type: string }
        checkoutReady: { type: boolean }
        message: { type: string }
        discountCodes:
          type: array
          items:
            type: object
            required: [code, applicable]
            properties:
              code: { type: string }
              applicable: { type: boolean }
    CartInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [add, update, remove, discount, note] }
        variantId: { type: string }
        lineId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        code: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 2000 }
    CheckoutInput:
      type: object
      properties:
        requestKey: { type: string, format: uuid }
        lang: { type: string, enum: [ar, en] }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        note: { type: string, maxLength: 2000 }
        address:
          $ref: "#/components/schemas/CheckoutAddressInput"
    DeliveryLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CheckoutAddressInput:
      allOf:
        - { $ref: "#/components/schemas/DeliveryAddressInput" }
        - type: object
          required: [location]
          properties:
            location: { $ref: "#/components/schemas/DeliveryLocation" }
    DeliveryAddressInput:
      type: object
      required: [area, block, street, house]
      properties:
        area: { type: string, minLength: 1, maxLength: 100 }
        block: { type: string, minLength: 1, maxLength: 100 }
        street: { type: string, minLength: 1, maxLength: 100 }
        house: { type: string, minLength: 1, maxLength: 100 }
        location: { $ref: "#/components/schemas/DeliveryLocation" }
    InquiryInput:
      type: object
      required: [cafeName, contactName, phone, email, area, products, notes, requestKey]
      properties:
        cafeName: { type: string, minLength: 1, maxLength: 200 }
        contactName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 8, maxLength: 30 }
        email: { type: string, format: email, maxLength: 200 }
        area: { type: string, minLength: 1, maxLength: 200 }
        products: { type: string, minLength: 1, maxLength: 3000 }
        notes: { type: string, maxLength: 3000 }
        requestKey: { type: string, minLength: 10, maxLength: 100 }
    Inquiry:
      allOf:
        - { $ref: "#/components/schemas/InquiryInput" }
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: integer }
            status: { type: string, enum: [new, contacted, closed] }
            createdAt: { type: string }
    InquiryUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, contacted, closed] }
    TrackingInput:
      type: object
      required: [orderNumber, phone]
      properties:
        orderNumber: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, minLength: 8, maxLength: 30 }
    TrackingResult:
      type: object
      required: [available, message, statusUrl]
      properties:
        available: { type: boolean }
        message: { type: string }
        statusUrl: { type: string }
        order: { $ref: "#/components/schemas/OrderStatus" }
    OrderStatus:
      type: object
      required: [number, stage, financialStatus, fulfillmentStatus, createdAt, total, currency, items, hasMoreItems]
      properties:
        number: { type: string }
        stage:
          type: string
          enum: [received, confirmed, preparing, partially_fulfilled, shipped, out_for_delivery, delivered, cancelled, review]
        financialStatus: { type: string }
        fulfillmentStatus: { type: string }
        createdAt: { type: string }
        total: { type: string }
        currency: { type: string }
        hasMoreItems: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [title, quantity]
            properties:
              title: { type: string }
              quantity: { type: integer }
    PaymentAvailability:
      type: object
      required: [enabled, shippingFils, methods]
      properties:
        enabled: { type: boolean }
        shippingFils: { type: [integer, "null"] }
        methods:
          type: array
          items: { type: string }
    OrderFulfillmentInput:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [preparing, out_for_delivery, delivered] }
    OperationResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    LocalOrder:
      allOf:
        - { $ref: "#/components/schemas/OrderStatus" }
        - type: object
          required: [id, phone, address, note, subtotal, shipping, stockStatus, invoiceId]
          properties:
            id: { type: string }
            phone: { type: string }
            address: { $ref: "#/components/schemas/DeliveryAddressInput" }
            note: { type: string }
            subtotal: { type: string }
            shipping: { type: string }
            stockStatus: { type: string }
            invoiceId: { type: string }
    OrderPage:
      type: object
      required: [orders, hasNextPage, endCursor, refreshedAt]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/OrderStatus" }
        hasNextPage: { type: boolean }
        endCursor: { type: string }
        refreshedAt: { type: string }
    AdminSummary:
      type: object
      required: [inquiryCount, newInquiryCount, lowStock, shopAdminUrl, shopCurrency, checkoutEnabled, notices]
      properties:
        inquiryCount: { type: integer }
        newInquiryCount: { type: integer }
        lowStock:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        shopAdminUrl: { type: string }
        shopCurrency: { type: string }
        checkoutEnabled: { type: boolean }
        notices:
          type: array
          items: { type: string }
